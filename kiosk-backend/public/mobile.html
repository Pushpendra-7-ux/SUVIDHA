<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Suvidha - Submit Complaint</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
    </style>
</head>
<body class="text-slate-800 antialiased min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-blue-600 text-white p-5 shadow-md rounded-b-3xl">
        <h1 class="text-2xl font-extrabold tracking-tight">Suvidha Mobile</h1>
        <p class="text-blue-100 text-sm font-medium mt-1">Quick Complaint Submission</p>
    </header>

    <!-- Main Content -->
    <main class="flex-1 p-5 w-full max-w-md mx-auto flex flex-col">
        
        <div id="sessionWarning" class="hidden bg-red-100 text-red-700 p-4 rounded-xl mb-6 text-sm font-semibold border border-red-200 shadow-sm">
            Warning: No Session ID found. Did you scan the QR code properly?
        </div>

        <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-100 flex-1">
            <h2 class="text-xl font-bold mb-4 text-slate-700">Complaint Details</h2>
            
            <form id="complaintForm" class="space-y-5">
                <!-- Photo Upload Simulation -->
                <div>
                    <label class="block text-sm font-semibold text-slate-600 mb-2">Evidence Photo</label>
                    <div class="border-2 border-dashed border-blue-200 rounded-2xl p-6 text-center bg-blue-50 cursor-pointer active:scale-95 transition-transform" onclick="simulateUpload()">
                        <div id="uploadText" class="text-blue-600 font-semibold">
                            <svg class="w-8 h-8 mx-auto mb-2 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                            Tap to Take Photo
                        </div>
                        <img id="photoPreview" class="hidden mx-auto rounded-lg max-h-32 shadow-sm border border-slate-200" src="" />
                    </div>
                </div>

                <!-- Description -->
                <div>
                    <label class="block text-sm font-semibold text-slate-600 mb-2">Description</label>
                    <textarea id="descInput" rows="3" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-4 text-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all" placeholder="Describe the issue..."></textarea>
                </div>
                
                <button type="submit" id="submitBtn" class="w-full bg-blue-600 hover:bg-blue-700 active:scale-[0.98] transition-all text-white font-bold text-lg py-4 rounded-xl shadow-lg shadow-blue-600/30 flex items-center justify-center gap-2 mt-4">
                    <span>Submit & Sync to Kiosk</span>
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                </button>
            </form>
        </div>
    </main>

    <!-- Success Overlay -->
    <div id="successOverlay" class="fixed inset-0 bg-blue-600 z-50 hidden flex-col items-center justify-center text-white px-6 text-center">
        <div class="w-24 h-24 bg-white rounded-full flex items-center justify-center mb-6 shadow-2xl">
            <svg class="w-12 h-12 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>
        </div>
        <h2 class="text-3xl font-extrabold mb-3">Synced!</h2>
        <p class="text-lg font-medium text-blue-100">Look up at the Kiosk screen to continue your complaint.</p>
    </div>

    <script>
        // Get Session ID from URL
        const urlParams = new URLSearchParams(window.location.search);
        const sessionId = urlParams.get('session');
        let uploadedPhotoUrl = "";

        if (!sessionId) {
            document.getElementById('sessionWarning').classList.remove('hidden');
        }

        // Simulate taking a photo
        function simulateUpload() {
            const preview = document.getElementById('photoPreview');
            const text = document.getElementById('uploadText');
            
            // Random image for demo
            uploadedPhotoUrl = "https://images.unsplash.com/photo-1515162816999-a0c47dc192f7?auto=format&fit=crop&w=400&q=80";
            
            preview.src = uploadedPhotoUrl;
            preview.classList.remove('hidden');
            text.classList.add('hidden');
        }

        // Handle Submission
        document.getElementById('complaintForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            if (!sessionId) {
                alert("Cannot submit: No Session ID found in URL.");
                return;
            }

            const btn = document.getElementById('submitBtn');
            btn.innerHTML = '<svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> Syncing...';
            btn.disabled = true;

            // The JSON Payload expected by the backend
            const payload = {
                photos: [
                    { 
                        url: uploadedPhotoUrl || "https://images.unsplash.com/photo-1515162816999-a0c47dc192f7?auto=format&fit=crop&w=400&q=80", 
                        description: "Photo taken by user" 
                    }
                ],
                location: {
                    latitude: 28.6139,
                    longitude: 77.2090,
                    address: "Evaluator's Location (Auto-detected)",
                    landmark: "GPS Accuracy: 5m",
                    city: "New Delhi",
                    state: "Delhi",
                    pincode: "110001"
                },
                problem: {
                    category: "General Complaint",
                    description: document.getElementById('descInput').value || "No description provided.",
                    severity: "Medium"
                },
                department: {
                    name: "Municipal Corporation",
                    subDepartment: "General"
                },
                complaintFiler: {
                    name: "Evaluator",
                    phone: "9876543210",
                    email: "evaluator@test.com",
                    address: "Local",
                    userId: "EVAL-001"
                }
            };

            try {
                const response = await fetch(`/api/complaint-sync/${sessionId}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (response.ok) {
                    document.getElementById('successOverlay').classList.remove('hidden');
                    document.getElementById('successOverlay').classList.add('flex');
                } else {
                    throw new Error('Failed to sync');
                }
            } catch (error) {
                alert("Error connecting to Kiosk. Are you using localtunnel?");
                btn.innerHTML = 'Try Again';
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
