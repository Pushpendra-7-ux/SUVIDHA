name: urban_app
description: URBAN – Smart Civic Reporting App. Report. Resolve. Improve.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  provider: ^6.1.2

  # Navigation
  go_router: ^14.8.1

  # UI
  google_fonts: ^6.2.1
  smooth_page_indicator: ^1.2.0+3
  shimmer: ^3.0.0
  animated_text_kit: ^4.2.3

  # Camera & Image
  image_picker: ^1.1.2

  # Location
  geolocator: ^13.0.2
  geocoding: ^3.0.0
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # QR Code
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.0.1

  # Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Network
  http: ^1.3.0
  connectivity_plus: ^6.1.4

  # AI Vision (direct Gemini API)
  google_generative_ai: ^0.4.6

  # Utils
  intl: any
  pin_code_fields: ^9.3.0
  permission_handler: ^11.3.1
  uuid: ^4.5.1
  path_provider: ^2.1.5

  # Icons
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
